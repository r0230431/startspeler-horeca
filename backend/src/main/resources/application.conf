ktor {
  deployment {
    port = 8081
    port = ${?KTOR_PORT}
  }
  application {
    modules = [ com.startspeler.horeca.ApplicationKt.module ]
  }
}

db {
  driver = ${?DB_DRIVER}
  url = ${?DB_URL}
  host = ${?DB_HOST}
  port = ${?DB_PORT}
  name = ${?DB_NAME}
  user = ${?DB_USER}
  password = ${?DB_PASSWORD}
  maxPoolSize = ${?DB_MAX_POOL_SIZE}
  minIdle = ${?DB_MIN_IDLE}
}

jwt {
  secret = ${?JWT_SECRET}
  issuer = ${?JWT_ISSUER}
  audience = ${?JWT_AUDIENCE}
  expirationMs = 86400000
}